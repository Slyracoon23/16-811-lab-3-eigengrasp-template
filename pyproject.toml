[project]
name = "lab-eigengrasp"
version = "0.1.0"
description = "Hand posture subspaces: the principal components a hand grasps in"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
